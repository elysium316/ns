name: Update Treintijden

on:
  schedule:
    - cron: '*/15 * * * 1,2,3,4,6'
    - cron: '*/10 0-9 * * 5'   # Vrijdag: Elke 15 min van 00:00 t/m 09:59
    - cron: '*/5 10-23 * * 5'  # Vrijdag: Elke 5 min van 10:00 t/m 23:59
    - cron: '*/10 0-17 * * 0'  # Zondag: Elke 15 min van 00:00 t/m 17:59
    - cron: '*/5 18-23 * * 0'  # Zondag: Elke 5 min van 18:00 t/m 23:59 
  workflow_dispatch: # Dit maakt een handmatige 'Start' knop in GitHub aan

permissions:
  contents: write # Dit is nodig zodat de robot het HTML bestand mag opslaan

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Haal de code op
        uses: actions/checkout@v3

      - name: Zet Python klaar
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installeer benodigde modules
        run: pip install requests

      - name: Vraag API op en bouw HTML
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: python update.py

      - name: Sla de HTML pagina op in de repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add info.html
          # Als er niets veranderd is (geen nieuwe treinen), gooit dit geen error
          git commit -m "Automatische update treintijden" || exit 0
          git push
